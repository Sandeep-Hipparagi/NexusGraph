name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      falkordb:
        # Pinned by digest to FalkorDB 4.22.1 — :latest drifted and broke the
        # variable-length-path recall Cypher used by the memory tools.
        image: falkordb/falkordb@sha256:b0bdcac2cbaff989e77cb0610439b7a9289e86de033ccbbd4368b66fb680ae7a
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      FALKORDB_HOST: 127.0.0.1
      FALKORDB_PORT: 6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run unit tests (no database required)
        run: pytest backend/tests/test_unit_core.py -v

      - name: Run integration tests (live FalkorDB)
        run: pytest backend/tests/test_api.py backend/tests/test_mcp_tools.py tests/test_client.py -v
